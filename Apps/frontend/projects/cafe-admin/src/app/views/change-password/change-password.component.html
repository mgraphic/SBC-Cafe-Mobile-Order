<div class="container">
  <div class="row">
    <div class="col-6 p-3">
      <div class="form-group">
        <label for="password">New Password</label>
        <input
          type="password"
          class="form-control"
          id="new-password"
          name="new-password"
          [(ngModel)]="newPassword"
        />
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          class="form-control"
          id="confirm-password"
          name="confirm-password"
          [(ngModel)]="confirmPassword"
        />
      </div>

      <div class="button-group">
        <button
          type="button"
          class="btn btn-primary"
          (click)="changePassword()"
        >
          Change Password
        </button>
      </div>
    </div>
  </div>
</div>
