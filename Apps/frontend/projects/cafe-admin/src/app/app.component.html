<section class="header">
  <a routerLink="/logout">Logout</a> | <a routerLink="/login">Login</a> |
  <a routerLink="/dashboard">Dashboard</a> |
  <a routerLink="/user-logs">User Service Logs</a> |
  <a routerLink="/user-management">User Management</a> |
  <a routerLink="/toast-test">Toast Test</a> |
  <a routerLink="/orders-test">Orders Test</a>
</section>

<div class="content-wrapper">
  <section class="content">
    <router-outlet />
  </section>
</div>

<lib-toasts></lib-toasts>

<ng-template #newOrderToast let-data>
  <div class="toast-header">
    <strong class="me-auto">New Order</strong>
  </div>
  <div class="toast-body">
    @for (item of data.items; track $index) {
      <div>{{ item.description }} x {{ item.quantity }}</div>
    }
  </div>
</ng-template>
