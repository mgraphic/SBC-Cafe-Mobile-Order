<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="x-apple-disable-message-reformatting" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>{{subject}}</title>
        <style type="text/css">
            body {
                margin: 0;
                padding: 0;
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
            }
            table {
                border-collapse: collapse;
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
            }
            @media only screen and (max-width: 600px) {
                .container {
                    width: 100% !important;
                }
                .content {
                    padding: 10px !important;
                }
                .otp-code {
                    font-size: 30px !important;
                    letter-spacing: 6px !important;
                }
            }
        </style>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        "
    >
        <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="background-color: #f4f4f4"
        >
            <tr>
                <td align="center" style="padding: 20px 0">
                    <table
                        role="presentation"
                        class="container"
                        width="600"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="
                            background-color: #ffffff;
                            border-radius: 8px;
                            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                        "
                    >
                        <tr>
                            <td
                                align="center"
                                style="
                                    padding: 40px 30px 30px 30px;
                                    background-color: #4caf50;
                                    border-radius: 8px 8px 0 0;
                                "
                            >
                                <h1
                                    style="
                                        margin: 0;
                                        color: #ffffff;
                                        font-size: 28px;
                                        font-weight: bold;
                                    "
                                >
                                    {{subject}}
                                </h1>
                            </td>
                        </tr>

                        <tr>
                            <td class="content" style="padding: 40px 30px">
                                <p
                                    style="
                                        margin: 0 0 20px 0;
                                        color: #333333;
                                        font-size: 16px;
                                        line-height: 1.6;
                                    "
                                >
                                    Hi {{#if
                                    recipientName}}{{recipientName}}{{else}}there{{/if}},
                                </p>

                                <p
                                    style="
                                        margin: 0 0 20px 0;
                                        color: #333333;
                                        font-size: 16px;
                                        line-height: 1.6;
                                    "
                                >
                                    Use the one-time passcode below to complete
                                    your verification.
                                </p>

                                <table
                                    role="presentation"
                                    cellpadding="0"
                                    cellspacing="0"
                                    border="0"
                                    width="100%"
                                    style="margin: 30px 0"
                                >
                                    <tr>
                                        <td
                                            align="center"
                                            style="
                                                padding: 18px 24px;
                                                border-radius: 8px;
                                                background-color: #f9f9f9;
                                                border: 1px dashed #c8c8c8;
                                            "
                                        >
                                            <div
                                                class="otp-code"
                                                style="
                                                    color: #222222;
                                                    font-size: 36px;
                                                    font-weight: bold;
                                                    letter-spacing: 8px;
                                                    line-height: 1.2;
                                                "
                                            >
                                                {{otp}}
                                            </div>
                                        </td>
                                    </tr>
                                </table>

                                <p
                                    style="
                                        margin: 0 0 20px 0;
                                        color: #333333;
                                        font-size: 16px;
                                        line-height: 1.6;
                                    "
                                >
                                    This code expires in {{validityMinutes}}
                                    minutes.
                                </p>

                                <p
                                    style="
                                        margin: 20px 0 0 0;
                                        color: #333333;
                                        font-size: 16px;
                                        line-height: 1.6;
                                    "
                                >
                                    Best regards,<br />
                                    <strong>{{senderName}}</strong>
                                </p>
                            </td>
                        </tr>

                        <tr>
                            <td
                                align="center"
                                style="
                                    padding: 30px;
                                    background-color: #f9f9f9;
                                    border-radius: 0 0 8px 8px;
                                    border-top: 1px solid #eeeeee;
                                "
                            >
                                <p
                                    style="
                                        margin: 0 0 10px 0;
                                        color: #666666;
                                        font-size: 14px;
                                        line-height: 1.5;
                                    "
                                >
                                    {{organizationName}}
                                </p>
                                <p
                                    style="
                                        margin: 0 0 10px 0;
                                        color: #999999;
                                        font-size: 12px;
                                        line-height: 1.5;
                                    "
                                >
                                    {{organizationAddress}}
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
